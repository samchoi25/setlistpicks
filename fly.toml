# fly.toml — setlistpicks.com
#
# Named for the product rather than any one festival: the app serves a page
# per festival from shared/festivals/, and `/` redirects to the current one.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'setlistpicks'
org = 'setlistpicks'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/setlistpicks.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'setlistpicks_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
