name: Hourly DB snapshot

on:
  schedule:
    - cron: '0 0 * * 1'   # every monday
  workflow_dispatch:        # also triggerable manually from the Actions tab

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Look the volume ID up at runtime rather than hardcoding it: the ID
      # changes whenever the volume is recreated (e.g. restoring a snapshot),
      # and a stale hardcoded ID fails silently until you need a backup.
      - name: Create volume snapshot
        run: |
          set -euo pipefail
          VOLUME_ID=$(flyctl volumes list --app setlistpicks --json | jq -r '.[0].id')
          test -n "$VOLUME_ID" && test "$VOLUME_ID" != "null"
          flyctl volumes snapshots create "$VOLUME_ID" --app setlistpicks
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
